<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#14538f" />
<title>QR棚卸</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --state: #14538f;
    --state-dark: #0d3962;
    --fg: #fff;
    --ring: #6fb7ff;
    --panel: rgba(0, 0, 0, .26);
  }

  body[data-state="waiting"] {
    --state: #14538f; --state-dark: #0d3962; --fg: #fff; --ring: #6fb7ff;
  }
  body[data-state="processing"] {
    --state: #d97706; --state-dark: #8c4b00; --fg: #fff; --ring: #ffb44a;
  }
  body[data-state="ok"] {
    --state: #0b8f43; --state-dark: #075d2d; --fg: #fff; --ring: #35d47c;
  }
  body[data-state="dup"] {
    --state: #f2c200; --state-dark: #a77d00; --fg: #211b00; --ring: #ffe66b;
  }
  body[data-state="err"] {
    --state: #c92d20; --state-dark: #831d15; --fg: #fff; --ring: #ff756c;
  }
  body[data-state="stopped"] {
    --state: #59636f; --state-dark: #343b43; --fg: #fff; --ring: #a8b1bb;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--state);
    color: var(--fg);
    transition: background-color .12s linear, color .12s linear;
    overscroll-behavior: none;
  }

  /* 画面の上下にも状態色を強く出す。遠目では「面」で状態が分かる。 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    left: 0; right: 0;
    height: 10px;
    background: var(--ring);
    z-index: 9999;
    pointer-events: none;
    box-shadow: 0 0 18px rgba(255,255,255,.35);
  }
  body::before { top: 0; }
  body::after { bottom: 0; }

  header {
    min-height: 48px;
    padding: 10px 14px;
    background: rgba(0,0,0,.34);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(6px);
  }
  .brand { font-size: 16px; font-weight: 900; white-space: nowrap; }
  #count { font-size: 13px; font-weight: 800; text-align: right; line-height: 1.25; }

  main {
    width: min(100%, 720px);
    margin: 0 auto;
    padding: 10px 12px 24px;
  }

  /* ===== 最重要：現在状態をカメラより上に表示 ===== */
  #panel {
    position: relative;
    overflow: hidden;
    min-height: 112px;
    margin: 2px 0 12px;
    padding: 12px 12px 11px;
    border: 4px solid rgba(255,255,255,.82);
    border-radius: 18px;
    background: var(--panel);
    text-align: center;
    box-shadow: 0 8px 26px rgba(0,0,0,.18);
  }
  #panelTop {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  #icon {
    font-size: clamp(42px, 11vw, 70px);
    line-height: .95;
    font-weight: 1000;
  }
  #label {
    font-size: clamp(29px, 7.8vw, 46px);
    line-height: 1.05;
    font-weight: 1000;
    letter-spacing: .035em;
  }
  #detail {
    margin-top: 6px;
    min-height: 20px;
    font-size: clamp(14px, 3.8vw, 18px);
    line-height: 1.25;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #progressLine {
    position: absolute;
    left: 0; bottom: 0;
    height: 7px;
    width: 100%;
    background: rgba(255,255,255,.2);
    overflow: hidden;
    opacity: 0;
  }
  #progressLine::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 42%;
    background: rgba(255,255,255,.88);
    transform: translateX(-110%);
  }
  body[data-state="processing"] #progressLine { opacity: 1; }
  body[data-state="processing"] #progressLine::after { animation: sending 1.05s linear infinite; }
  @keyframes sending { to { transform: translateX(340%); } }

  /* ===== カメラ ===== */
  #camWrap {
    position: relative;
    overflow: hidden;
    width: 100%;
    background: #000;
    border-radius: 20px;
    border: 8px solid #fff;
    box-shadow:
      0 0 0 7px var(--ring),
      0 12px 30px rgba(0,0,0,.25);
    transition: box-shadow .12s linear, transform .12s ease;
    isolation: isolate;
  }
  body[data-state="processing"] #camWrap {
    box-shadow: 0 0 0 8px var(--ring), 0 0 28px var(--ring), 0 12px 30px rgba(0,0,0,.25);
  }
  body[data-state="ok"] #camWrap,
  body[data-state="dup"] #camWrap,
  body[data-state="err"] #camWrap {
    box-shadow: 0 0 0 12px var(--ring), 0 0 42px var(--ring), 0 12px 30px rgba(0,0,0,.25);
    transform: scale(.992);
  }

  #reader { width: 100%; min-height: 270px; background: #000; }
  #reader video { width: 100% !important; display: block; object-fit: cover; }

  /* カメラ内の状態ラベル。画面全体の色だけでなく、視線がカメラにある時も分かる。 */
  #camState {
    position: absolute;
    z-index: 20;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    min-width: 46%;
    max-width: 88%;
    padding: 9px 16px;
    border-radius: 999px;
    border: 3px solid rgba(255,255,255,.9);
    background: var(--state);
    color: var(--fg);
    font-size: clamp(16px, 4.3vw, 24px);
    font-weight: 1000;
    text-align: center;
    line-height: 1.1;
    box-shadow: 0 4px 16px rgba(0,0,0,.36);
    pointer-events: none;
    white-space: nowrap;
  }

  /* 狙い位置の補助。読み取り処理そのものには干渉しない。 */
  #aimGuide {
    position: absolute;
    z-index: 12;
    inset: 15% 10%;
    border: 4px solid rgba(255,255,255,.78);
    border-radius: 22px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.26);
    pointer-events: none;
  }
  #aimGuide::after {
    content: "QRを枠内へ";
    position: absolute;
    left: 50%; bottom: 10px;
    transform: translateX(-50%);
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.58);
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
  }

  /* 読取結果を0.7秒だけ大きくフラッシュ。次のQRを狙う邪魔をしない。 */
  #resultFlash {
    position: absolute;
    z-index: 30;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.12);
    opacity: 0;
    pointer-events: none;
  }
  #resultFlash.show { animation: flashResult .72s ease-out both; }
  #flashIcon {
    width: clamp(118px, 34vw, 190px);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 10px solid #fff;
    background: var(--state);
    color: var(--fg);
    font-size: clamp(82px, 24vw, 132px);
    font-weight: 1000;
    line-height: 1;
    box-shadow: 0 0 0 10px var(--ring), 0 12px 30px rgba(0,0,0,.4);
  }
  @keyframes flashResult {
    0% { opacity: 0; transform: scale(.88); }
    18% { opacity: 1; transform: scale(1); }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ===== 現場操作ボタン ===== */
  .primaryRow,
  .row { display: flex; gap: 9px; margin: 12px 0 0; }
  button {
    flex: 1;
    min-height: 54px;
    padding: 12px 10px;
    border: 0;
    border-radius: 14px;
    background: #fff;
    color: #17202b;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(.98); }
  button.ghost {
    background: rgba(255,255,255,.18);
    color: var(--fg);
    border: 2px solid rgba(255,255,255,.72);
  }
  button.on { background: #ffe97b; color: #342900; }
  #btnToggle { font-size: 18px; }

  details {
    margin-top: 12px;
    border-radius: 15px;
    background: rgba(0,0,0,.18);
    border: 2px solid rgba(255,255,255,.32);
    overflow: hidden;
  }
  summary {
    list-style: none;
    padding: 15px 14px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "＋"; float: right; font-size: 20px; }
  details[open] summary::after { content: "－"; }
  .settingsBody { padding: 0 12px 14px; }

  .cap { font-size: 13px; font-weight: 900; margin: 13px 0 5px; opacity: .95; }
  .vol { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .vol button { min-height: 48px; padding: 8px 2px; font-size: 14px; }
  .vol button.sel { background: #16202c; color: #fff; outline: 3px solid rgba(255,255,255,.7); }

  .zoomLine { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: center; }
  .zoomLine button { min-height: 48px; font-size: 23px; padding: 4px; }
  input[type="range"] { width: 100%; height: 38px; accent-color: #fff; }
  #zoomValue { text-align: center; font-weight: 900; font-size: 13px; margin-top: -3px; }

  #soundState { font-size: 12px; font-weight: 800; opacity: .92; margin-top: 5px; }
  .note { font-size: 12px; font-weight: 700; line-height: 1.45; opacity: .92; margin: 7px 0 0; }

  /* ===== 一覧 ===== */
  #listWrap { display: none; margin-top: 12px; overflow-x: auto; }
  table {
    width: 100%;
    min-width: 520px;
    border-collapse: collapse;
    background: #fff;
    color: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
  }
  th, td { padding: 9px 7px; font-size: 13px; text-align: left; border-bottom: 1px solid #e1e5ea; }
  th { background: #eef1f5; }
  td.s-ok { color: #087e3b; font-weight: 900; }
  td.s-dup { color: #8a6800; font-weight: 900; }
  td.s-err { color: #bc271c; font-weight: 900; }
  td.s-pending { color: #9a5b00; font-weight: 900; }
  .content-cell { word-break: break-all; }
  .empty { color: #777; text-align: center; padding: 18px; }

  @media (orientation: landscape) and (min-width: 720px) {
    main { width: min(100%, 980px); }
    #panel { min-height: 96px; padding: 9px 12px 8px; }
    #icon { font-size: 46px; }
    #label { font-size: 34px; }
    #camWrap { max-height: 62vh; }
    #reader video { max-height: 62vh; object-fit: contain; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-state="stopped">
<header>
  <div class="brand">📦 QR棚卸</div>
  <div id="count">登録 0<br>重複 0 / エラー 0</div>
</header>

<main>
  <section id="panel" aria-live="polite" aria-atomic="true">
    <div id="panelTop">
      <div id="icon">■</div>
      <div id="label">起動中</div>
    </div>
    <div id="detail"></div>
    <div id="progressLine"></div>
  </section>

  <div id="camWrap">
    <div id="reader"></div>
    <div id="aimGuide"></div>
    <div id="camState">起動中</div>
    <div id="resultFlash"><div id="flashIcon">✓</div></div>
  </div>

  <div class="primaryRow">
    <button id="btnToggle">スキャン停止</button>
    <button id="btnTorch" class="ghost" style="display:none;">🔦 ライト</button>
  </div>

  <details id="settings">
    <summary>設定・履歴</summary>
    <div class="settingsBody">
      <div id="zoomWrap" style="display:none;">
        <div class="cap">ズーム（遠いQR用）</div>
        <div class="zoomLine">
          <button id="zoomDown" class="ghost" type="button">－</button>
          <input type="range" id="zoom" min="1" max="4" step="0.1" value="1" />
          <button id="zoomUp" class="ghost" type="button">＋</button>
        </div>
        <div id="zoomValue">1.0×</div>
      </div>

      <div class="cap">スキャン音量</div>
      <div class="vol" id="volRow">
        <button data-v="0">消音</button>
        <button data-v="1">小</button>
        <button data-v="2">中</button>
        <button data-v="3">大</button>
        <button data-v="4">最大</button>
      </div>
      <div id="soundState">端末本体のメディア音量も上げてください。</div>

      <div class="row">
        <button id="btnTest" class="ghost">🔊 音を確認</button>
        <button id="btnSpeak" class="ghost">音声読み上げ：オフ</button>
      </div>
      <div class="row">
        <button id="btnList" class="ghost">一覧を表示</button>
        <button id="btnReload" class="ghost">シート再取得</button>
      </div>
      <div class="row">
        <button id="btnFullscreen" class="ghost">全画面表示</button>
      </div>

      <div id="vibNote" class="note" style="display:none;">
        ※この端末は振動非対応のため、音と画面表示でお知らせします。
      </div>
      <div class="note">
        ※ブラウザから端末本体の最大音量を超えて鳴らすことはできません。「最大」は聞き取りやすい音程・回数を強めた設定です。
      </div>

      <div id="listWrap">
        <table>
          <thead>
            <tr><th>順</th><th>日時</th><th>QR内容</th><th>状態</th></tr>
          </thead>
          <tbody id="list">
            <tr><td colspan="4" class="empty">まだスキャンがありません</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </details>
</main>

<script>
  // ===== 設定 =====================================================
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxTGviS-98Mww0jwSy-tPN04KXmOsHi057wBD6RyT7ZKZgQho4RlhqcQsoVAEfrz0h5/exec';
  const TOKEN = 'tana2026secret';
  const DEDUP_MS = 3000;         // 同じQRを連続認識した時に無視する時間
  const HOLD_MS = 1800;          // 成功/重複/失敗の色を保持する時間
  const REQUEST_TIMEOUT_MS = 12000; // 通信が長時間終わらない時はエラーにして状態を戻す
  // ================================================================

  const $ = id => document.getElementById(id);
  const iconEl = $('icon');
  const labelEl = $('label');
  const detailEl = $('detail');
  const camStateEl = $('camState');
  const countEl = $('count');
  const listEl = $('list');
  const listWrap = $('listWrap');
  const btnToggle = $('btnToggle');
  const btnList = $('btnList');
  const btnReload = $('btnReload');
  const btnTorch = $('btnTorch');
  const btnTest = $('btnTest');
  const btnSpeak = $('btnSpeak');
  const btnFullscreen = $('btnFullscreen');
  const zoomWrap = $('zoomWrap');
  const zoomEl = $('zoom');
  const zoomDown = $('zoomDown');
  const zoomUp = $('zoomUp');
  const zoomValue = $('zoomValue');
  const resultFlash = $('resultFlash');
  const flashIcon = $('flashIcon');

  const FACE = {
    waiting:    { icon: '◎', label: '読み取り待ち' },
    processing: { icon: '↻', label: '処理中' },
    ok:         { icon: '✓', label: '登録完了' },
    dup:        { icon: '!', label: '登録済み' },
    err:        { icon: '×', label: '登録失敗' },
    stopped:    { icon: '■', label: 'スキャン停止中' }
  };

  const FLASH_FACE = { ok: '✓', dup: '!', err: '×' };

  const vibrateSupported = 'vibrate' in navigator;
  if (!vibrateSupported) $('vibNote').style.display = 'block';

  let scanner = null;
  let running = false;
  let torchOn = false;
  let holdTimer = null;
  let flashTimer = null;
  let processingTicker = null;
  let items = [];
  let counter = 0;
  let seq = 0;
  let latestScanSeq = 0;

  // 各QRごとの直近認識時刻。A→B→Aのような連続認識でも誤再送を防ぐ。
  const seenAt = new Map();
  const registered = new Set();
  const pendingCodes = new Set();
  const pendingRequests = new Map();

  function saveSetting(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) {}
  }
  function loadSetting(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? fallback : v;
    } catch (e) { return fallback; }
  }

  function setThemeColor() {
    const c = getComputedStyle(document.body).getPropertyValue('--state').trim();
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta && c) meta.setAttribute('content', c);
  }

  function setState(type, detail = '', hold = false) {
    clearTimeout(holdTimer);
    document.body.dataset.state = type;
    iconEl.textContent = FACE[type].icon;
    labelEl.textContent = FACE[type].label;
    camStateEl.textContent = FACE[type].label;
    detailEl.textContent = detail;
    setThemeColor();
    if (hold) holdTimer = setTimeout(idleState, HOLD_MS);
  }

  function processingDetail() {
    if (pendingRequests.size === 0) return '送信中';
    const starts = [...pendingRequests.values()].map(x => x.startedAt);
    const oldest = Math.min(...starts);
    const sec = Math.max(0, (Date.now() - oldest) / 1000).toFixed(1);
    return '送信中 ' + pendingRequests.size + '件 ・ ' + sec + '秒';
  }

  function ensureProcessingTicker() {
    if (processingTicker) return;
    processingTicker = setInterval(() => {
      if (pendingRequests.size === 0) {
        clearInterval(processingTicker);
        processingTicker = null;
        return;
      }
      if (document.body.dataset.state === 'processing') {
        detailEl.textContent = processingDetail();
      }
    }, 250);
  }

  function idleState() {
    clearTimeout(holdTimer);
    if (pendingRequests.size > 0) {
      setState('processing', processingDetail());
      ensureProcessingTicker();
    } else if (running) {
      setState('waiting', 'QRコードをかざしてください');
    } else {
      setState('stopped', '「スキャン開始」を押してください');
    }
  }

  function flashResult(type) {
    if (!FLASH_FACE[type]) return;
    clearTimeout(flashTimer);
    flashIcon.textContent = FLASH_FACE[type];
    resultFlash.classList.remove('show');
    void resultFlash.offsetWidth;
    resultFlash.classList.add('show');
    flashTimer = setTimeout(() => resultFlash.classList.remove('show'), 760);
  }

  function formatNow() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
      + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function addItem(content, status) {
    const item = { order: ++counter, time: formatNow(), content, status };
    items.unshift(item);
    render();
    return item;
  }

  function statusClass(status) {
    if (status === '登録成功') return 's-ok';
    if (status === '重複' || status === '登録済み') return 's-dup';
    if (status === '登録失敗') return 's-err';
    return 's-pending';
  }

  function render() {
    const ok = items.filter(i => i.status === '登録成功').length;
    const dup = items.filter(i => i.status === '重複' || i.status === '登録済み').length;
    const err = items.filter(i => i.status === '登録失敗').length;
    countEl.innerHTML = '登録 ' + ok + '<br>重複 ' + dup + ' / エラー ' + err;

    if (items.length === 0) {
      listEl.innerHTML = '<tr><td colspan="4" class="empty">まだスキャンがありません</td></tr>';
      return;
    }

    listEl.innerHTML = items.map(it =>
      '<tr>' +
        '<td>' + it.order + '</td>' +
        '<td>' + escapeHtml(it.time) + '</td>' +
        '<td class="content-cell">' + escapeHtml(it.content) + '</td>' +
        '<td class="' + statusClass(it.status) + '">' + escapeHtml(it.status) + '</td>' +
      '</tr>'
    ).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function vibrate(pattern) {
    if (vibrateSupported) navigator.vibrate(pattern || 180);
  }

  // ===== 音 =======================================================
  // Web Audioの増幅は端末本体の物理最大音量を超えない。
  // 「最大」は音量に加えて回数・時間・周波数を強め、騒音下で気付きやすくする。
  const VOL = [0, 0.18, 0.42, 0.75, 1.0];
  let volIdx = Number(loadSetting('qr-volume', 3));
  if (!Number.isInteger(volIdx) || volIdx < 0 || volIdx > 4) volIdx = 3;

  let audioCtx = null;
  let master = null;
  let comp = null;

  function initAudio() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -20;
        comp.knee.value = 12;
        comp.ratio.value = 10;
        comp.attack.value = 0.003;
        comp.release.value = 0.16;
        master = audioCtx.createGain();
        master.gain.value = VOL[volIdx];
        comp.connect(master);
        master.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function setVolume(i, save = true) {
    volIdx = i;
    if (master) master.gain.value = VOL[i];
    document.querySelectorAll('#volRow button').forEach(b => {
      b.classList.toggle('sel', Number(b.dataset.v) === i);
    });
    if (save) saveSetting('qr-volume', i);
  }

  function tone(freq, dur, delay = 0, type = 'square', gain = .62) {
    if (!audioCtx || VOL[volIdx] === 0) return;
    try {
      const t = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(g);
      g.connect(comp);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + .008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.start(t);
      osc.stop(t + dur + .025);
    } catch (e) {}
  }

  function beepOk() {
    tone(1080, .11, 0);
    tone(1480, .12, .10);
    if (volIdx === 4) tone(1860, .14, .21);
  }
  function beepDup() {
    tone(700, .16, 0);
    tone(700, .16, .21);
    if (volIdx === 4) tone(700, .16, .42);
  }
  function beepErr() {
    tone(330, .25, 0, 'sawtooth', .7);
    tone(250, .34, .28, 'sawtooth', .7);
  }

  let speakOn = loadSetting('qr-speak', '0') === '1';
  function speak(text) {
    if (!speakOn || !('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 1.12;
      u.volume = 1;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  document.addEventListener('touchstart', initAudio, { once: true, passive: true });
  document.addEventListener('click', initAudio, { once: true });

  // ===== 読み取り =================================================
  function onScan(decodedText) {
    const content = String(decodedText);
    const now = Date.now();
    const prev = seenAt.get(content) || 0;

    // 同じQRがカメラに映り続けた時の連打を抑止。
    if (now - prev < DEDUP_MS) return;
    seenAt.set(content, now);

    // 既に通信中の同一QRは二重送信しない。
    if (pendingCodes.has(content)) {
      setState('processing', processingDetail());
      return;
    }

    // この端末内ですでに登録済みと判定できる場合は即時に黄色。
    if (registered.has(content)) {
      addItem(content, '重複');
      setState('dup', '同じQRはすでに登録されています', true);
      flashResult('dup');
      beepDup();
      vibrate([70, 70, 70]);
      speak('登録済みです');
      return;
    }

    register(content);
  }

  async function fetchWithTimeout(url, options = {}, timeoutMs = REQUEST_TIMEOUT_MS) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  async function register(content) {
    const requestSeq = ++seq;
    latestScanSeq = requestSeq;
    const item = addItem(content, '登録中');

    pendingCodes.add(content);
    pendingRequests.set(requestSeq, { content, startedAt: Date.now() });
    setState('processing', processingDetail());
    ensureProcessingTicker();
    vibrate(90); // 「読み取った」ことだけ即時フィードバック。登録完了とは分ける。

    let resultType = null;
    let resultDetail = '';

    try {
      const res = await fetchWithTimeout(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ content, device: navigator.userAgent, token: TOKEN })
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (data.ok) {
        item.status = '登録成功';
        registered.add(content);
        if (data.timestamp) item.time = data.timestamp;
        resultType = 'ok';
        resultDetail = '登録しました';
      } else if (data.duplicate) {
        item.status = '重複';
        registered.add(content);
        resultType = 'dup';
        resultDetail = '同じQRはすでに登録されています';
      } else {
        item.status = '登録失敗';
        resultType = 'err';
        resultDetail = data.error ? 'エラー：' + data.error : '登録できませんでした';
      }
    } catch (err) {
      item.status = '登録失敗';
      resultType = 'err';
      resultDetail = err && err.name === 'AbortError'
        ? '通信が12秒以上応答しませんでした'
        : '通信エラーが発生しました';
    } finally {
      pendingCodes.delete(content);
      pendingRequests.delete(requestSeq);
      render();
    }

    // 連続スキャン時、古い通信結果があとから届いて「現在表示」を巻き戻さない。
    // 一番新しく読み取ったQRの結果だけを大表示する。
    if (requestSeq === latestScanSeq) {
      setState(resultType, resultDetail, true);
      flashResult(resultType);
      if (resultType === 'ok') {
        beepOk(); vibrate(220); speak('登録しました');
      } else if (resultType === 'dup') {
        beepDup(); vibrate([70,70,70]); speak('登録済みです');
      } else {
        beepErr(); vibrate([140,80,140]); speak('登録できません');
      }
    } else {
      // 古い結果は一覧だけ更新。最新結果の緑/黄/赤表示中なら絶対に上書きしない。
      // まだ「処理中」の時だけ残件数を更新する。
      if (document.body.dataset.state === 'processing') idleState();
    }
  }

  async function loadAll() {
    const loadSeq = ++seq;
    pendingRequests.set(loadSeq, { content: '__load__', startedAt: Date.now() });
    setState('processing', 'シートを取得中');
    ensureProcessingTicker();

    try {
      const res = await fetchWithTimeout(
        GAS_URL + '?action=list&limit=100&token=' + encodeURIComponent(TOKEN),
        {},
        REQUEST_TIMEOUT_MS
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (data.ok) {
        const total = data.rows.length;
        items = data.rows.map((r, i) => ({
          order: total - i,
          time: r.timestamp,
          content: String(r.content),
          status: r.status
        }));
        counter = total;
        // 現在セッションで把握済みのコードは残しつつ、シート側の登録済みコードを追加する。
        data.rows.forEach(r => registered.add(String(r.content)));
        render();
        listWrap.style.display = 'block';
        btnList.textContent = '一覧を隠す';
        setState('ok', 'シートの最新 ' + total + ' 件を取得しました', true);
        flashResult('ok');
        beepOk();
      } else {
        setState('err', 'シートを取得できませんでした', true);
        flashResult('err');
        beepErr();
      }
    } catch (err) {
      const msg = err && err.name === 'AbortError'
        ? 'シート取得がタイムアウトしました'
        : 'シート取得で通信エラーが発生しました';
      setState('err', msg, true);
      flashResult('err');
      beepErr();
    } finally {
      pendingRequests.delete(loadSeq);
    }
  }

  // ===== カメラ制御 ===============================================
  function videoTrack() {
    const v = document.querySelector('#reader video');
    return v && v.srcObject ? v.srcObject.getVideoTracks()[0] : null;
  }

  function updateZoomLabel() {
    zoomValue.textContent = Number(zoomEl.value).toFixed(1) + '×';
  }

  async function applyZoom(value) {
    const track = videoTrack();
    if (!track) return;
    const min = Number(zoomEl.min);
    const max = Number(zoomEl.max);
    const next = Math.min(max, Math.max(min, Number(value)));
    zoomEl.value = next;
    updateZoomLabel();
    try {
      await track.applyConstraints({ advanced: [{ zoom: next }] });
    } catch (e) {}
  }

  function setupCameraControls() {
    const track = videoTrack();
    if (!track || !track.getCapabilities) return;

    let caps = {};
    try { caps = track.getCapabilities() || {}; } catch (e) { return; }

    if (caps.torch) btnTorch.style.display = '';

    if (caps.zoom) {
      zoomWrap.style.display = 'block';
      zoomEl.min = caps.zoom.min;
      zoomEl.max = caps.zoom.max;
      zoomEl.step = caps.zoom.step || .1;
      zoomEl.value = track.getSettings().zoom || caps.zoom.min;
      updateZoomLabel();
    }

    // 対応端末では連続AFを指定。
    try {
      const advanced = [];
      if (Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
        advanced.push({ focusMode: 'continuous' });
      }
      if (advanced.length) track.applyConstraints({ advanced });
    } catch (e) {}
  }

  btnTorch.addEventListener('click', async () => {
    const track = videoTrack();
    if (!track) return;
    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      btnTorch.classList.toggle('on', torchOn);
      btnTorch.textContent = torchOn ? '🔦 ライト：ON' : '🔦 ライト';
    } catch (e) {
      torchOn = false;
      btnTorch.classList.remove('on');
      btnTorch.textContent = '🔦 ライト';
    }
  });

  zoomEl.addEventListener('input', () => applyZoom(Number(zoomEl.value)));
  zoomDown.addEventListener('click', () => applyZoom(Number(zoomEl.value) - Number(zoomEl.step || .1) * 4));
  zoomUp.addEventListener('click', () => applyZoom(Number(zoomEl.value) + Number(zoomEl.step || .1) * 4));

  async function startScan() {
    if (running) return;
    initAudio();
    scanner = scanner || new Html5Qrcode('reader', { verbose: false });

    try {
      setState('processing', 'カメラを起動中');
      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 18,
          qrbox: (w, h) => {
            const size = Math.floor(Math.min(w, h) * .88);
            return { width: size, height: size };
          },
          experimentalFeatures: { useBarCodeDetectorIfSupported: true }
        },
        onScan,
        () => {}
      );

      running = true;
      btnToggle.textContent = '■ スキャン停止';
      idleState();
      setTimeout(setupCameraControls, 700);
    } catch (err) {
      running = false;
      btnToggle.textContent = '▶ スキャン開始';
      setState('err', 'カメラを起動できません。権限を確認してください', true);
      flashResult('err');
      beepErr();
    }
  }

  async function stopScan() {
    if (!running || !scanner) return;
    try { await scanner.stop(); } catch (e) {}
    running = false;
    torchOn = false;
    btnTorch.classList.remove('on');
    btnTorch.textContent = '🔦 ライト';
    btnToggle.textContent = '▶ スキャン開始';
    idleState();
  }

  // ===== イベント =================================================
  btnToggle.addEventListener('click', () => running ? stopScan() : startScan());

  btnList.addEventListener('click', () => {
    const show = listWrap.style.display !== 'block';
    listWrap.style.display = show ? 'block' : 'none';
    btnList.textContent = show ? '一覧を隠す' : '一覧を表示';
  });

  btnReload.addEventListener('click', loadAll);
  btnTest.addEventListener('click', () => { initAudio(); beepOk(); });

  btnSpeak.addEventListener('click', () => {
    speakOn = !speakOn;
    saveSetting('qr-speak', speakOn ? '1' : '0');
    btnSpeak.classList.toggle('on', speakOn);
    btnSpeak.textContent = speakOn ? '音声読み上げ：オン' : '音声読み上げ：オフ';
    if (speakOn) speak('音声読み上げを開始します');
  });

  document.querySelectorAll('#volRow button').forEach(b => {
    b.addEventListener('click', () => {
      initAudio();
      setVolume(Number(b.dataset.v));
      beepOk();
    });
  });

  btnFullscreen.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
        btnFullscreen.textContent = '全画面を終了';
      } else {
        await document.exitFullscreen();
        btnFullscreen.textContent = '全画面表示';
      }
    } catch (e) {}
  });

  document.addEventListener('fullscreenchange', () => {
    btnFullscreen.textContent = document.fullscreenElement ? '全画面を終了' : '全画面表示';
  });

  // 画面に戻った時は、ユーザーが明示的に停止していなければ再開する。
  let stoppedByUser = false;
  btnToggle.addEventListener('click', () => { stoppedByUser = running; });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !running && !stoppedByUser) startScan();
  });

  window.addEventListener('online', () => {
    if (running && pendingRequests.size === 0) setState('waiting', '通信復旧・読み取りできます');
  });
  window.addEventListener('offline', () => {
    setState('err', 'ネットワークに接続されていません', true);
    flashResult('err');
    beepErr();
  });

  window.addEventListener('load', () => {
    setVolume(volIdx, false);
    btnSpeak.classList.toggle('on', speakOn);
    btnSpeak.textContent = speakOn ? '音声読み上げ：オン' : '音声読み上げ：オフ';
    startScan();
  });
</script>
</body>
</html>
