<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#14538f" />
<title>QR棚卸アプリ　URL変更のお知らせ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: #f2f4f7;
    color: #17202b;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  main { width: min(100%, 560px); margin: 0 auto; padding: 22px 16px 40px; }

  h1 {
    margin: 0 0 18px;
    padding: 14px 14px;
    background: #14538f;
    color: #fff;
    border-radius: 12px;
    font-size: clamp(19px, 5.2vw, 24px);
    font-weight: 900;
    line-height: 1.35;
  }
  p { margin: 0 0 14px; font-size: clamp(15px, 4.1vw, 17px); line-height: 1.75; font-weight: 600; }

  h2 {
    margin: 26px 0 8px;
    font-size: clamp(16px, 4.4vw, 18px);
    font-weight: 900;
    color: #14538f;
    border-left: 7px solid #14538f;
    padding-left: 9px;
    line-height: 1.4;
  }
  a.url {
    display: block;
    padding: 16px 14px;
    background: #fff;
    border: 3px solid #14538f;
    border-radius: 12px;
    color: #14538f;
    font-size: clamp(16px, 4.5vw, 19px);
    font-weight: 900;
    word-break: break-all;
    line-height: 1.5;
    text-decoration: none;
  }
  a.url:active { background: #e8eff8; }

  dl { margin: 0; }
  dt { font-size: clamp(14px, 3.9vw, 16px); font-weight: 900; margin-top: 10px; }
  dd { margin: 3px 0 0; font-size: clamp(14px, 3.9vw, 16px); font-weight: 600; line-height: 1.7; }

  .warn {
    margin-top: 22px;
    padding: 15px 14px;
    background: #fff;
    border-left: 9px solid #c92d20;
    border-radius: 10px;
    color: #8e1b11;
    font-size: clamp(15px, 4.1vw, 17px);
    font-weight: 800;
    line-height: 1.7;
  }
  .close { margin-top: 24px; font-size: clamp(15px, 4.1vw, 17px); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>【QR棚卸アプリ　URL変更のお知らせ】</h1>

  <p>お世話になっております。<br>QR棚卸アプリのURLが変更になりました。</p>

  <h2>■新URL</h2>
  <a class="url" href="https://atm222.github.io/tanaver2/">https://atm222.github.io/tanaver2/</a>

  <p style="margin-top:16px;">お手数ですが、新URLをお気に入り（ホーム画面）に登録し、旧URLは削除してください。</p>

  <h2>■ホーム画面への追加方法</h2>
  <dl>
    <dt>iPhone（Safari）</dt>
    <dd>共有ボタン → 「ホーム画面に追加」</dd>
    <dt>Android（Chrome）</dt>
    <dd>右上の ⠇ → 「ホーム画面に追加」</dd>
  </dl>

  <div class="warn">
    旧URLのアイコンが残っていると、誤って古い画面を開いてしまうため、必ず削除をお願いいたします。
  </div>

  <p class="close">よろしくお願いいたします。</p>
</main>
</body>
</html>
